name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout latest code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Verify JavaScript syntax
        run: |
          node --check src/db.js
          for f in src/functions/*.js src/khaoyai/*.js; do
            node --check "$f"
          done
          tar -czf backend-release.tar.gz src sql package.json package-lock.json host.json

      - name: 4. Deploy to Azure VM and restart khaoyai304-backend.service
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USERNAME }}
          VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          node -e '
            const fs = require("fs");
            const raw = (process.env.VM_SSH_KEY || "").trim();
            if (!raw) {
              console.error("ERROR: AZURE_VM_SSH_KEY secret is empty!");
              process.exit(1);
            }
            if (/^(ssh-rsa|ssh-ed25519|ecdsa-)/.test(raw)) {
              console.error("ERROR: AZURE_VM_SSH_KEY contains a PUBLIC key (.pub). Please use the PRIVATE key (-----BEGIN OPENSSH PRIVATE KEY-----).");
              process.exit(1);
            }
            let keyText = raw;
            if (!raw.includes("BEGIN ")) {
              const decoded = Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8").trim();
              if (decoded.includes("BEGIN ")) keyText = decoded;
            }
            const m = keyText.match(/(-----BEGIN [A-Z0-9 ]+-----)([\s\S]+?)(-----END [A-Z0-9 ]+-----)/);
            if (m) {
              const body = m[2].replace(/[^A-Za-z0-9+/=]/g, "");
              const lines = body.match(/.{1,70}/g) || [];
              keyText = [m[1].trim(), ...lines, m[3].trim(), ""].join("\n");
            } else {
              keyText = keyText.replace(/\r\n/g, "\n").trim() + "\n";
            }
            fs.writeFileSync(process.env.HOME + "/.ssh/id_deploy", keyText, { mode: 0o600 });
          '
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          echo "Using public key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no backend-release.tar.gz "$VM_USER@$VM_HOST:/tmp/backend-release.tar.gz"

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" '
            set -e
            export PATH="/opt/node-v22.23.4-linux-x64/bin:$PATH"
            APP_DIR="/opt/khaoyai304-backend"
            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf /tmp/backend-release.tar.gz -C "$APP_DIR"
            rm -f /tmp/backend-release.tar.gz
            cd "$APP_DIR"
            sudo env PATH="/opt/node-v22.23.4-linux-x64/bin:$PATH" npm install --omit=dev
            sudo systemctl restart khaoyai304-backend.service
            sudo systemctl status khaoyai304-backend.service --no-pager -n 15
          '
